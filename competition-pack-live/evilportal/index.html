<!DOCTYPE html>
<!--
  LAB USE ONLY - internal security demo.
  Captive-portal phish demo page for the lab ESP32 access point
  (WiFi Marauder evil portal on the isolated lab network).
  No external resources, no scripts, no beacons. Credentials typed
  here are captured to the lab Flipper's SD card only and are
  deleted on stage during the post-demo restore checklist.
  Audience members sign in with organizer-issued TEST credentials.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabGuest WiFi - Sign in</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #10243e;
    color: #10243e;
  }
  .card {
    width: min(92vw, 380px);
    background: #ffffff;
    border-radius: 12px;
    padding: 28px 24px 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .logo {
    display: block;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #1d5fd1;
    color: #ffffff;
    font-weight: 700;
    font-size: 20px;
    line-height: 44px;
    text-align: center;
    margin-bottom: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { font-size: 14px; color: #4a5a6a; margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  input {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #b9c4cf;
    border-radius: 8px;
  }
  input:focus { outline: 2px solid #1d5fd1; outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 6px;
    padding: 11px;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background: #1d5fd1;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .foot {
    margin: 16px 0 0;
    font-size: 11px;
    color: #7a8896;
    text-align: center;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="logo" aria-hidden="true">LG</span>
    <h1>LabGuest WiFi</h1>
    <p class="sub">Sign in with your guest credentials to get online.</p>
    <form method="post" action="/login">
      <label>Username
        <input type="text" name="username" autocomplete="off" required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Connect</button>
    </form>
    <p class="foot">Internal security demo &mdash; lab network only</p>
  </main>
</body>
</html>
